basePath: /
definitions:
  handlers.DeleteResponse:
    properties:
      deleted_at:
        type: string
      id:
        type: string
      message:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      code:
        type: string
      details:
        type: string
      error:
        type: string
    type: object
  handlers.UploadResponse:
    properties:
      content_type:
        type: string
      delete_token:
        type: string
      expires_at:
        type: string
      id:
        type: string
      original_name:
        type: string
      size:
        type: integer
      url:
        type: string
    type: object
host: localhost:7000
info:
  contact:
    name: API Support
    url: https://github.com/Sardonyx001/sefud
  description: Simple, encrypted file upload & download service
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: sefud API
  version: "1.0"
paths:
  /{id}:
    delete:
      consumes:
      - application/json
      description: Delete a file by its ID using delete token for authorization
      parameters:
      - description: File ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Delete token for authorization
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: File deleted successfully
          schema:
            $ref: '#/definitions/handlers.DeleteResponse'
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Invalid delete token
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: File not found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "410":
          description: File already deleted or expired
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Delete a file
      tags:
      - files
    get:
      description: Download a file by its ID with streaming support and range requests
      parameters:
      - description: File ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Range header for partial content requests
        in: header
        name: Range
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: File content
          schema:
            type: file
        "206":
          description: Partial file content
          schema:
            type: file
        "400":
          description: Invalid file ID
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: File not found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "410":
          description: File expired
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Download a file
      tags:
      - files
  /up:
    post:
      consumes:
      - multipart/form-data
      description: Upload a file to R2 storage with high-performance chunked upload
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Expiration duration (e.g., '24h', '7d')
        in: formData
        name: expires
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: File uploaded successfully
          schema:
            $ref: '#/definitions/handlers.UploadResponse'
        "400":
          description: Bad request - invalid file or parameters
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: File too large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "415":
          description: Unsupported media type
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Upload a file
      tags:
      - files
schemes:
- http
- https
swagger: "2.0"
