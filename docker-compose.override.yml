# Docker Compose override for development
# This file is automatically loaded by docker-compose
version: '3.8'

services:
  sefud:
    # Override for development - mount source code for live reload
    volumes:
      - .:/app
      - ./uploads:/uploads
    # Enable development mode
    environment:
      - GO_ENV=development

  postgres:
    # Expose database for development access
    ports:
      - "5432:5432"

  minio:
    # Expose MinIO for development access
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console

# Optional: Remove caddy for development (direct access to sefud)
  caddy:
    profiles:
      - production